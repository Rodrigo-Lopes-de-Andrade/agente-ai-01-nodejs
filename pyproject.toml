[project]
name = "dsa-12-projeto-daytrade-agentes"
version = "0.1.0"
description = "Projeto Pratico - Day Trade Analytics em Tempo Real com Agentes de IA (ambiente moderno com uv)"
readme = "LEIAME.txt"
requires-python = ">=3.12,<3.14"

# ATENCAO, ALUNO: aqui usamos ">=" (limite inferior) e nao "==" (versao travada).
# O requirements.txt original congelou tudo em fevereiro/2025. Travar versao e como
# tirar uma foto: envelhece. O ">=" diz "desta versao para cima", e o arquivo uv.lock
# guarda a foto exata do que foi instalado hoje -- assim voce tem reprodutibilidade
# SEM ficar preso a pacotes velhos.
dependencies = [
    # --- Framework de Agentes de IA (o que o capitulo ensina) ---
    # phidata e o framework original do curso. Ele nao recebe atualizacao desde
    # jan/2025 (foi sucedido pelo "agno"), mas continua funcionando -- e a decisao
    # aqui foi manter fidelidade ao que o video mostra.
    "phidata>=2.7",

    # --- Provedores de LLM (o "cerebro" dos agentes) ---
    "groq>=1.7",        # Groq: o provedor original do capitulo (nuvem, rapido)
    "openai>=3.8",      # OpenAI: usada tambem para o Grok/xAI (mesma biblioteca)
    "anthropic>=1.4",   # Anthropic: modelos Claude
    "ollama>=0.5",      # Ollama: LLM rodando na sua propria maquina, de graca

    # --- Ferramentas que os agentes usam ---
    "ddgs>=9.0",              # Busca na web (novo nome do duckduckgo_search)
    "duckduckgo-search>=8.1", # Nome antigo, ainda exigido por dentro do phidata

    # --- Dados financeiros e graficos ---
    "yfinance>=1.7",  # Cotacoes do Yahoo Finance (era 0.2.x, hoje ja e 1.x)
    "pandas>=2.2",    # Tabelas de dados
    "plotly>=7.0",    # Graficos interativos (era 6.x)

    # --- App web ---
    "streamlit>=1.60",  # Transforma um script Python em site, sem HTML/CSS

    # --- Utilitarios ---
    "python-dotenv>=1.0",  # Le o arquivo .env com as chaves de API
    "requests>=2.32",
]

# "package = false" significa: esta pasta e um PROJETO (um conjunto de scripts),
# nao uma BIBLIOTECA para ser publicada no PyPI. Sem isso o uv tentaria "construir"
# o capitulo como se fosse um pacote e reclamaria da falta de codigo-fonte.
[tool.uv]
package = false

# Dependencias de DESENVOLVIMENTO: o que voce usa para estudar (notebook no
# VSCode), mas que o app em si nao precisa. O 'uv sync' instala este grupo por
# padrao, entao no WSL nada muda. Na AWS EC2, 'uv sync --no-dev' pula o grupo
# e poupa ~200 MB de Jupyter que o servidor nunca abriria (LEIAME, secao 9.6).
[dependency-groups]
dev = [
    # --- Notebook dentro do VSCode ---
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyter>=1.1",
]
